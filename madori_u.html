const M = 0.91, WH = 2.4, FL2 = 3.0;

const mats = {};

function box(g, w, h, d, x, y, z, color, cast = true, recv = true) {

function label(g, text, x, y, z, small) {
  const lines = text.split('\n'), fs = 44, pad = 12;
  const cv = document.createElement('canvas'), c2 = cv.getContext('2d');
  const fnt = '700 ' + fs + 'px -apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
  c2.font = fnt;
  const w = Math.max(...lines.map(t => c2.measureText(t).width)) + pad * 2, h = lines.length * fs * 1.15 + pad * 2;
  cv.width = Math.ceil(w); cv.height = Math.ceil(h);
  c2.font = fnt;
  c2.fillStyle = 'rgba(255,255,255,.82)'; c2.fillRect(0, 0, cv.width, cv.height);
  c2.fillStyle = '#1f2328'; c2.textAlign = 'center'; c2.textBaseline = 'middle';
  lines.forEach((t, i) => c2.fillText(t, cv.width / 2, pad + fs * 1.15 * (i + .5)));

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));

const levels = D.floors.map((fl, n) => {
  const g = new THREE.Group(), wg = new THREE.Group(); g.add(wg); g.userData.wg = wg;
  box(g, D.W * M + 1.6, 0.04, D.H * M + 1.6, 0, -0.09, 0, 0xdfe6dc, false);
  for (const rm of fl.rooms) {
    let a = 0;

      a += (x1 - x0) * (y1 - y0);
      if (rm.kind !== '吹抜') box(g, (x1 - x0) * M, 0.06, (y1 - y0) * M, (x0 + x1) / 2 * M - cx, -0.03, (y0 + y1) / 2 * M - cz, COL[rm.kind] ?? 0xffffff, false);
    }
    const r = rm.rects.reduce((p, c) => (c[2] - c[0]) * (c[3] - c[1]) > (p[2] - p[0]) * (p[3] - p[1]) ? c : p);
    const name = (rm.label || rm.name).replace('?', '').replace('(小)', '');
    if (name === 'PS') continue;
    const small = (r[2] - r[0]) < 1.6 || (r[3] - r[1]) < 1.1;
    const txt = name + (['外', '階段'].includes(rm.kind) || name === '階段の吹抜け' ? '' : '\n' + (+(a / 2).toFixed(3)) + '帖');

  }

    const W = [[2.5, 6, 3.5, 6.5], [3.0, 6.5, 3.5, 7], [2.0, 6.5, 3.0, 7], [1.5, 6.5, 2.0, 7], [1.5, 6, 2.5, 6.5]];
    W.forEach(([a, b, c, d], k) => box(g, (c - a) * M - 0.04, 0.04, (d - b) * M - 0.04, (a + c) / 2 * M - cx, R * (9 + k) - 0.02, (b + d) / 2 * M - cz, wood));

const state = { f:'1', v:'o', w:'l' };
function apply(resetCam = true) {
  const [g1, g2] = levels, f = state.f;

document.querySelectorAll('#bar button[data-f]').forEach(b => b.onclick = () => { state.f = b.dataset.f; apply(); });
document.querySelectorAll('#bar button[data-v]').forEach(b => b.onclick = () => { state.v = b.dataset.v; apply(); });
document.querySelectorAll('#bar button[data-w]').forEach(b => b.onclick = () => { state.w = b.dataset.w; apply(false); });

window.__shot = (f, v, w = 1600, h = 1200, wl = 'l') => {
