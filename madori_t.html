html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }

canvas { display:block; width:100%; height:100%; touch-action:none; }
#hint { position:absolute; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); font-size:12px; color:var(--sub); background:rgba(255,255,255,.85); border-radius:8px; padding:6px 10px; pointer-events:none; }

  ctl.target.set(0, ty, 0);
  if (state.v === 't') cam.position.set(0, ty + 17 * need, 0.02);
  else { const dist = 16.5 * need, sx = f === 'b' ? 0 : 0.22; cam.position.set(dist * sx, ty + dist * 0.86, dist * 0.46); }
  ctl.update();
}
function resize() {
  const w = wrap.clientWidth || 800, h = wrap.clientHeight || 600;
  renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
document.querySelectorAll('#bar button[data-f]').forEach(b => b.onclick = () => { state.f = b.dataset.f; apply(); });
document.querySelectorAll('#bar button[data-v]').forEach(b => b.onclick = () => { state.v = b.dataset.v; apply(); });
document.querySelectorAll('#bar button[data-w]').forEach(b => b.onclick = () => { state.w = b.dataset.w; apply(false); });
q('#t3').onclick = () => { q('#v3d').style.display = 'flex'; q('#v2d').style.display = 'none'; q('#t3').classList.add('on'); q('#t2').classList.remove('on'); resize(); };
q('#t2').onclick = () => { q('#v3d').style.display = 'none'; q('#v2d').style.display = 'block'; q('#t2').classList.add('on'); q('#t3').classList.remove('on'); };
window.addEventListener('resize', resize);
resize(); apply();
(function loop() { requestAnimationFrame(loop); ctl.update(); renderer.render(scene, cam); })();
// 画像の書き出し（作成時の確認用）
window.__shot = (f, v, w = 1600, h = 1200, wl = 'l') => {
  state.f = f; state.v = v; state.w = wl; renderer.setPixelRatio(1); renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  apply(); renderer.render(scene, cam); return canvas.toDataURL('image/jpeg', 0.92);
};
</script>
</body>
